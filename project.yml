name: Pet
options:
  bundleIdPrefix: io.dsh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO

targets:
  Pet:
    type: application
    platform: iOS
    sources:
      - path: ios/Pet
        excludes:
          - "web/**"
          - "Info.plist"
      - path: ios/Pet/web
        type: folder
    dependencies:
      - target: PetWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Pet
        PRODUCT_BUNDLE_IDENTIFIER: io.dsh.pet.ios
        INFOPLIST_FILE: ios/Pet/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SUPPORTS_MACCATALYST: NO
        ONLY_ACTIVE_ARCH: NO
    scheme:
      testTargets: []

  PetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/PetWidget
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: PetWidget
        PRODUCT_BUNDLE_IDENTIFIER: io.dsh.pet.ios.widget
        INFOPLIST_FILE: ios/PetWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        ONLY_ACTIVE_ARCH: NO
