name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos-14 (Xcode 15.4) gets a runner immediately, and XcodeGen 2.38.0 below
    # still emits the Xcode 15 project format (objectVersion 56).
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Fail fast if web assets are missing
        run: |
          test -f ios/Pet/web/index.html
          test -f ios/Pet/web/pet-data.js
          test -d ios/Pet/web/anim
          echo "clips: $(ls ios/Pet/web/anim | wc -l)"
          du -sh ios/Pet/web

      - name: Install XcodeGen 2.38.0
        run: |
          set -euo pipefail
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -q xcodegen.zip -d xc
          BIN=$(find "$PWD/xc" -name xcodegen -type f | head -n 1)
          echo "binary: $BIN"
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          grep -m1 objectVersion Pet.xcodeproj/project.pbxproj
          ls -la Pet.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Pet.xcodeproj \
            -target Pet \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 4 -type d -name "Pet.app" | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          test -d "$APP"
          ls -la "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../Pet-unsigned.ipa Payload
          cd ..
          ls -lh Pet-unsigned.ipa
          unzip -l Pet-unsigned.ipa | head -n 30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pet-unsigned-ipa
          path: Pet-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
